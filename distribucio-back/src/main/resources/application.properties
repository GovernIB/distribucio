server.servlet.context-path=/distribucioback
server.error.path=/error
server.forward-headers-strategy=framework

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
#spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.open-in-view=false
spring.main.allow-circular-references=true
spring.thymeleaf.templateResolverOrder=1
spring.data.rest.base-path=/data-rest

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.freemarker.enabled=false
spring.messages.basename=messages
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.jackson.default-property-inclusion=non_null

spring.liquibase.enabled=false
#spring.liquibase.enabled=true
#spring.liquibase.database-change-log-table=DATABASECHANGELOG
#spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
#spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
#spring.liquibase.labels=none

spring.cache.jcache.config=classpath:ehcache.xml

spring.jmx.enabled=true
spring.management.endpoints.jmx.exposure.include="*"

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration

# Permet validar Bearer JWT (a més del login per sessió ja existent) contra el mateix realm
# Keycloak que ja s'usa per al client OAuth2 (spring.security.oauth2.client.provider.keycloak.*,
# normalment definit a l'application.properties local/desplegament). El fa servir el SPA React
# quan es corre amb `npm run dev` a :5173 amb OidcAuthProvider (sense sessió compartida amb
# el backend -- veure WebSecurityConfig).
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri:}
#spring.devtools.restart.enabled=false


logging.level.root=INFO
logging.level.org.reflections.Reflections=WARN


# Esdeveniments SSE (Server-Sent Events) cap al navegador -- veure SseResourceController.
# Interval del ping de manteniment de les connexions obertes, en mil·lisegons. Ha de quedar per
# davall del timeout d'inactivitat del proxy que hi hagi davant (60 s amb la configuració per
# defecte d'Apache); si no, la connexió es talla i el client reconnecta cada minut.
#es.caib.distribucio.sse.ping.interval=20000
# URL del broker JMS intern que fa de pont entre la capa de negoci i les connexions SSE. Per
# defecte un broker Artemis encastat dins la mateixa JVM (veure JmsConfig i JmsClientConfig).
#es.caib.distribucio.jms.broker.url=vm://0
